  <style>
:root {
  color-scheme: dark;
  --bg: #10140f;
  --card: #1a2118;
  --line: #31402c;
  --text: #f3f6ef;
  --muted: #b7c3ae;
  --accent: #d6a24a;
  --accent-ink: #1b1406;
  --ok: #8fbf7a;
  --warn: #e0a15a;
  --danger: #d97862;
  font-family: "Segoe UI", "Source Sans 3", sans-serif;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(circle at top, #24301f, var(--bg) 42%);
  color: var(--text);
}
main { max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; }
a { color: #f0d59a; }
h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; line-height: 1.2; }
h1 { font-size: 2rem; margin: 0.2rem 0; }
.eyebrow { letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); font-size: 0.78rem; margin: 0; }
.lede, .fine, .meta, .skill { color: var(--muted); }
.card, .cat, .miss {
  background: rgba(26, 33, 24, 0.92);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px;
  margin: 14px 0;
}
fieldset { border: 1px solid var(--line); border-radius: 12px; margin: 12px 0; }
label { display: block; margin: 8px 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }
button, .choice {
  border-radius: 999px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--text);
  padding: 10px 14px;
}
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
button:disabled { opacity: 0.45; }
.choice { display: flex; gap: 10px; align-items: flex-start; border-radius: 12px; margin: 8px 0; cursor: pointer; }
.choice.selected { border-color: var(--accent); background: #2b2618; }
.mark { min-width: 1.6rem; font-weight: 700; color: var(--accent); }
.passage { white-space: pre-wrap; border-left: 3px solid var(--accent); padding-left: 12px; color: #e7ecdf; }
.testbar, .split { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; }
.dot { width: 42px; height: 42px; padding: 0; }
.dot.done { border-color: var(--ok); }
.dot.here { background: var(--accent); color: var(--accent-ink); }
.dot.flag { box-shadow: inset 0 -3px 0 var(--warn); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.cat.weak { border-color: var(--warn); }
.cat.ok { border-color: var(--ok); }
.need { color: var(--warn); }
.oknote { color: var(--ok); }
.miss { border-color: var(--danger); }
@media (max-width: 640px) {
  h1 { font-size: 1.6rem; }
  .testbar { align-items: flex-start; }
}

  </style>
</head>

      explanation: "Choice B is correct. The passage says a strong score in one subject does not replace a score in the other. It also lists geometry as part of the mathematics portion."
    }
  ]
};

const PRACTICE = {
  "Quantitative Reasoning": [
    { label: "Khan Academy: ratios and rates", url: "https://www.khanacademy.org/math/cc-sixth-grade-math/cc-6th-ratios-prop-topic" },
    { label: "Khan Academy: percentages", url: "https://www.khanacademy.org/math/cc-seventh-grade-math/cc-7th-fractions-decimals/cc-7th-percent-problems/v/solving-percent-problems" }
  ],
  "Algebraic Reasoning": [
    { label: "Khan Academy: linear equations", url: "https://www.khanacademy.org/math/algebra/x2f8bb11595b61c86:solve-equations-inequalities" },
    { label: "Khan Academy: quadratic equations", url: "https://www.khanacademy.org/math/algebra/x2f8bb11595b61c86:quadratic-functions-equations" }
  ],
  "Geometric and Spatial Reasoning": [
    { label: "Khan Academy: area and volume", url: "https://www.khanacademy.org/math/cc-sixth-grade-math/cc-6th-geometry-topic" },
    { label: "Khan Academy: Pythagorean theorem", url: "https://www.khanacademy.org/math/cc-eighth-grade-math/cc-8th-geometry/cc-8th-pythagorean-theorem" }
  ],
  "Probabilistic and Statistical Reasoning": [
    { label: "Khan Academy: statistics and probability", url: "https://www.khanacademy.org/math/statistics-probability" },
    { label: "Khan Academy: mean, median, and mode", url: "https://www.khanacademy.org/math/statistics-probability/summarizing-quantitative-data" }
  ],
  "Literary Text Analysis": [
    { label: "Khan Academy: reading literary texts", url: "https://www.khanacademy.org/ela/cc-9th-reading-vocab/x8c7a9c6f:cc-9th-reading-for-understanding" }
  ],
  "Informational Text Analysis": [
    { label: "Khan Academy: informational text", url: "https://www.khanacademy.org/ela/cc-9th-reading-vocab" }
  ],
  "Text Synthesis": [
    { label: "Khan Academy: comparing arguments", url: "https://www.khanacademy.org/ela/cc-9th-reading-vocab" }
  ],
  "Essay Revision and Editing": [
    { label: "Khan Academy: grammar and clarity", url: "https://www.khanacademy.org/humanities/grammar" }
  ],
  "Sentence Revision and Conventions": [
    { label: "Khan Academy: grammar", url: "https://www.khanacademy.org/humanities/grammar" },
    { label: "Purdue OWL: sentence punctuation", url: "https://owl.purdue.edu/owl/general_writing/punctuation/index.html" }
  ]
};

const OFFICIAL = [
  { label: "College Board TSIA2 sample questions", url: "https://accuplacer.collegeboard.org/students/tsia2-additional-resources" },
  { label: "TSIA2 ELAR sample PDF", url: "https://accuplacer.collegeboard.org/accuplacer/pdf/tsia2-english-language-arts-reading-sample-questions.pdf" },
  { label: "TSIA2 Mathematics sample PDF", url: "https://accuplacer.collegeboard.org/accuplacer/pdf/tsia2-mathematics-sample-questions.pdf" },
  { label: "TSIA2 essay guide", url: "https://accuplacer.collegeboard.org/accuplacer/pdf/tsia2-essay-test-sample-essays.pdf" }
];


const STORAGE_KEY = "tsia2-practice-state-v1";
const RESULTS_KEY = "tsia2-practice-results-v1";

const state = {
  view: "home",
  session: null,
  results: null
};

const $ = (sel) => document.querySelector(sel);

function loadSession() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
  } catch {
    return null;
  }
}

function loadResults() {
  try {
    return JSON.parse(localStorage.getItem(RESULTS_KEY) || "null");
  } catch {
    return null;
  }
}

function saveSession() {
  if (!state.session) localStorage.removeItem(STORAGE_KEY);
  else localStorage.setItem(STORAGE_KEY, JSON.stringify(state.session));
}

function saveResults(results) {
  state.results = results;
  localStorage.setItem(RESULTS_KEY, JSON.stringify(results));
}

function letter(i) {
  return String.fromCharCode(65 + i);
}

function shuffle(list) {
  const copy = list.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function questionsFor(section) {
  return BANK[section].map((q) => ({ ...q, section }));
}

function buildSession(form) {
  const sections = form.sections;
  let pool = [];
  sections.forEach((section) => {
    pool = pool.concat(questionsFor(section));
  });
  const fullCount = pool.length;
  const count = form.length === "all" ? fullCount : Math.min(fullCount, Number(form.length));
  const picked = shuffle(pool).slice(0, count);
  return {
    id: Date.now(),
    sections,
    lengthLabel: form.length === "all" ? "Full bank" : `${count} questions`,
    items: picked.map((q) => q.id),
    index: 0,
    answers: {},
    flags: {},
    startedAt: Date.now(),
    updatedAt: Date.now()
  };
}

function itemById(id) {
  return [...BANK.math, ...BANK.elar].find((q) => q.id === id);
}

function currentItem() {
  const id = state.session.items[state.session.index];
  return itemById(id);
}

function elapsed(ms) {
  const sec = Math.floor(ms / 1000);
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}

function render() {
  const root = $("#app");
  if (state.view === "home") root.innerHTML = homeHtml();
  if (state.view === "test") root.innerHTML = testHtml();
  if (state.view === "results") root.innerHTML = resultsHtml();
  bind();
}

function homeHtml() {
  const saved = loadSession();
  const last = loadResults();
  const resume = saved
    ? `<section class="card resume">
        <h2>Unfinished attempt</h2>
        <p>${saved.lengthLabel} · question ${saved.index + 1} of ${saved.items.length} · saved in this browser</p>
        <div class="row">
          <button class="primary" data-action="resume">Resume test</button>
          <button class="ghost" data-action="discard">Discard</button>
        </div>
      </section>`
    : "";
  const lastCard = last
    ? `<section class="card">
        <h2>Last score</h2>
        <p>${last.correct} / ${last.total} correct (${last.percent}%) · ${new Date(last.finishedAt).toLocaleString()}</p>
        <button class="ghost" data-action="last">Review last results</button>
      </section>`
    : "";
  return `
    <header class="hero">
      <p class="eyebrow">Texas Success Initiative Assessment 2.0 · practice</p>
      <h1>TSIA2 English and Math sample</h1>
      <p class="lede">Original multiple-choice items written to the TSIA2 content categories. This is not the official College Board test and does not produce a CRC score.</p>
    </header>
    ${resume}
    ${lastCard}
    <form id="setup" class="card">
      <h2>Start a test</h2>
      <fieldset>
        <legend>Section</legend>
        <label><input type="radio" name="section" value="both" checked> English and Math</label>
        <label><input type="radio" name="section" value="elar"> English only (20)</label>
        <label><input type="radio" name="section" value="math"> Math only (20)</label>
      </fieldset>
      <fieldset>
        <legend>Length</legend>
        <label><input type="radio" name="length" value="all" checked> Full sample</label>
        <label><input type="radio" name="length" value="5"> 5 questions</label>
        <label><input type="radio" name="length" value="10"> 10 questions</label>
        <label><input type="radio" name="length" value="15"> 15 questions</label>
      </fieldset>
      <button class="primary" type="submit">Begin</button>
      <p class="fine">Progress is stored in this browser only. The official multiple-choice sections are untimed, so this timer is informational.</p>
    </form>
    <section class="card split">
      <div>
        <h2>What the real test covers</h2>
        <p><strong>ELAR CRC:</strong> about 30 adaptive items, literary and informational reading plus revision and sentence skills. College-ready routes also require an essay score of 5–8.</p>
        <p><strong>Math CRC:</strong> 20 items across quantitative, algebraic, geometric, and statistical reasoning. Statewide readiness is a CRC of 950–990, or a CRC below 950 plus Diagnostic Level 6.</p>
      </div>
      <div>
        <h2>Official samples</h2>
        <ul>${OFFICIAL.map((l) => `<li><a href="${l.url}" target="_blank" rel="noreferrer">${l.label}</a></li>`).join("")}</ul>
      </div>
    </section>`;
}

function testHtml() {
  const session = state.session;
  const q = currentItem();
  const n = session.index + 1;
  const total = session.items.length;
  const selected = session.answers[q.id];
  const flagged = !!session.flags[q.id];
  const passage = q.passage ? `<blockquote class="passage">${escapeHtml(q.passage)}</blockquote>` : "";
  const choices = q.choices.map((choice, i) => `
    <label class="choice ${selected === i ? "selected" : ""}">
      <input type="radio" name="choice" value="${i}" ${selected === i ? "checked" : ""}>
      <span class="mark">${letter(i)}</span>
      <span>${escapeHtml(choice)}</span>
    </label>`).join("");
  const dots = session.items.map((id, i) => {
    const answered = session.answers[id] !== undefined;
    const flag = session.flags[id];
    return `<button class="dot ${i === session.index ? "here" : ""} ${answered ? "done" : ""} ${flag ? "flag" : ""}" data-go="${i}" aria-label="Question ${i + 1}">${i + 1}</button>`;
  }).join("");
  return `
    <header class="testbar">
      <div>
        <p class="eyebrow">${q.section === "math" ? "Mathematics" : "ELAR"} · ${q.category}</p>
        <h1>Question ${n} of ${total}</h1>
      </div>
      <div class="meta">
        <span id="clock">${elapsed(Date.now() - session.startedAt)}</span>
        <button class="ghost" data-action="save-exit">Save and exit</button>
      </div>
    </header>
    <section class="card question">
      ${passage}
      <p class="skill">${q.skill}</p>
      <h2>${escapeHtml(q.stem)}</h2>
      <form id="choices">${choices}</form>
      <div class="row">
        <button class="ghost" data-action="flag">${flagged ? "Unflag" : "Flag for review"}</button>
        <span class="spacer"></span>
        <button class="ghost" data-action="prev" ${session.index === 0 ? "disabled" : ""}>Back</button>
        ${session.index === total - 1
          ? `<button class="primary" data-action="grade">Grade test</button>`
          : `<button class="primary" data-action="next">Next</button>`}
      </div>
    </section>
    <nav class="dots" aria-label="Question navigator">${dots}</nav>`;
}

function gradeSession(session) {
  const rows = session.items.map((id) => {
    const q = itemById(id);
    const chosen = session.answers[id];
    return {
      id,
      section: q.section,
      category: q.category,
      skill: q.skill,
      stem: q.stem,
      choices: q.choices,
      answer: q.answer,
      chosen,
      correct: chosen === q.answer,
      explanation: q.explanation
    };
  });
  const correct = rows.filter((r) => r.correct).length;
  const byCategory = {};
  rows.forEach((r) => {
    if (!byCategory[r.category]) byCategory[r.category] = { correct: 0, total: 0, section: r.section };
    byCategory[r.category].total += 1;
    if (r.correct) byCategory[r.category].correct += 1;
  });
  return {
    finishedAt: Date.now(),
    startedAt: session.startedAt,
    lengthLabel: session.lengthLabel,
    correct,
    total: rows.length,
    percent: Math.round((correct / rows.length) * 100),
    unanswered: rows.filter((r) => r.chosen === undefined).length,
    byCategory,
    rows
  };
}

function resultsHtml() {
  const r = state.results;
  const cats = Object.entries(r.byCategory).map(([name, stat]) => {
    const pct = Math.round((stat.correct / stat.total) * 100);
    const weak = pct < 80;
    const links = (PRACTICE[name] || []).map((l) => `<a href="${l.url}" target="_blank" rel="noreferrer">${l.label}</a>`).join(" · ");
    return `<article class="cat ${weak ? "weak" : "ok"}">
      <h3>${name}</h3>
      <p>${stat.correct} / ${stat.total} · ${pct}%</p>
      ${weak ? `<p class="need">Practice this area. ${links}</p>` : `<p class="oknote">On track in this sample. ${links}</p>`}
    </article>`;
  }).join("");
  const missed = r.rows.filter((row) => !row.correct).map((row) => {
    const yours = row.chosen === undefined ? "No answer" : `${letter(row.chosen)}. ${row.choices[row.chosen]}`;
    return `<article class="miss">
      <p class="skill">${row.category} · ${row.skill}</p>
      <h3>${escapeHtml(row.stem)}</h3>
      <p><strong>Your answer:</strong> ${escapeHtml(yours)}</p>
      <p><strong>Correct:</strong> ${letter(row.answer)}. ${escapeHtml(row.choices[row.answer])}</p>
      <p>${escapeHtml(row.explanation)}</p>
    </article>`;
  }).join("");
  return `
    <header class="hero">
      <p class="eyebrow">Results saved in this browser</p>
      <h1>${r.correct} / ${r.total} correct</h1>
      <p class="lede">${r.percent}% · ${r.lengthLabel} · ${elapsed(r.finishedAt - r.startedAt)} elapsed · ${r.unanswered} unanswered</p>
    </header>
    <section class="card">
      <h2>This is not a CRC score</h2>
      <p>Official Mathematics readiness is a CRC of 950–990, or a CRC below 950 plus Diagnostic Level 6. Official ELAR readiness is a CRC of 945–990 plus an essay of 5–8, or a CRC below 945 plus Diagnostic Level 5 or 6 and an essay of 5–8. A raw percent here cannot be converted into those scaled scores.</p>
    </section>
    <section class="grid">${cats}</section>
    <section class="card">
      <h2>${missed ? "Review these items" : "No missed items in this attempt"}</h2>
      ${missed || "<p>Every selected item matched the checked answer key.</p>"}
    </section>
    <section class="card">
      <h2>Official practice</h2>
      <ul>${OFFICIAL.map((l) => `<li><a href="${l.url}" target="_blank" rel="noreferrer">${l.label}</a></li>`).join("")}</ul>
      <div class="row">
        <button class="primary" data-action="home">New test</button>
        <button class="ghost" data-action="clear-results">Clear saved score</button>
      </div>
    </section>`;
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "\u0026amp;")
    .replace(/</g, "\u003c")
    .replace(/>/g, "\u003e")
    .replace(/"/g, "\u0026quot;");
}

function bind() {
  const setup = $("#setup");
  if (setup) {
    setup.addEventListener("submit", (event) => {
      event.preventDefault();
      const data = new FormData(setup);
      const section = data.get("section");
      const sections = section === "both" ? ["elar", "math"] : [section];
      state.session = buildSession({ sections, length: data.get("length") });
      saveSession();
      state.view = "test";
      render();
    });
  }
  document.querySelectorAll("[data-action]").forEach((btn) => {
    btn.addEventListener("click", () => handle(btn.dataset.action));
  });
  document.querySelectorAll("[data-go]").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.session.index = Number(btn.dataset.go);
      state.session.updatedAt = Date.now();
      saveSession();
      render();
    });
  });
  const choices = $("#choices");
  if (choices) {
    choices.addEventListener("change", (event) => {
      const q = currentItem();
      state.session.answers[q.id] = Number(event.target.value);
      state.session.updatedAt = Date.now();
      saveSession();
      render();
    });
  }
}

function handle(action) {
  if (action === "resume") {
    state.session = loadSession();
    state.view = "test";
    render();
  }
  if (action === "discard") {
    localStorage.removeItem(STORAGE_KEY);
    state.session = null;
    render();
  }
  if (action === "last") {
    state.results = loadResults();
    state.view = "results";
    render();
  }
  if (action === "save-exit") {
    saveSession();
    state.view = "home";
    render();
  }
  if (action === "flag") {
    const q = currentItem();
    state.session.flags[q.id] = !state.session.flags[q.id];
    saveSession();
    render();
  }
  if (action === "prev" && state.session.index > 0) {
    state.session.index -= 1;
    saveSession();
    render();
  }
  if (action === "next" && state.session.index < state.session.items.length - 1) {
    state.session.index += 1;
    saveSession();
    render();
  }
  if (action === "grade") {
    const unanswered = state.session.items.filter((id) => state.session.answers[id] === undefined).length;
    const ok = unanswered === 0 || confirm(`${unanswered} question${unanswered === 1 ? "" : "s"} unanswered. Grade anyway?`);
    if (!ok) return;
    const results = gradeSession(state.session);
    saveResults(results);
    localStorage.removeItem(STORAGE_KEY);
    state.session = null;
    state.view = "results";
    render();
  }
  if (action === "home") {
    state.view = "home";
    render();
  }
  if (action === "clear-results") {
    localStorage.removeItem(RESULTS_KEY);
    state.results = null;
    state.view = "home";
    render();
  }
}

let clock;
function tick() {
  const el = $("#clock");
  if (el && state.session) el.textContent = elapsed(Date.now() - state.session.startedAt);
}

document.addEventListener("DOMContentLoaded", () => {
  state.results = loadResults();
  render();
  clock = setInterval(tick, 1000);
});

  </script>
</body>
</html>
